# Netlify deploy config for XP Portfolio + Decap CMS
# Note: /api/csp-report is a Vercel serverless function. On Netlify alone,
# report-uri will 404 unless you add an equivalent function or external sink.
[build]
  publish = "."
  # No build command — pure static site
  command = "echo 'Static site — no build step'"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow"
    Report-To = '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"/api/csp-report"}],"include_subdomains":false}'
    Reporting-Endpoints = 'csp-endpoint="/api/csp-report"'
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https://api.github.com https://github.com https://*.github.com https://unpkg.com; frame-src 'self' https://github.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; report-uri /api/csp-report; report-to csp-endpoint"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Report-To = '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"/api/csp-report"}],"include_subdomains":false}'
    Reporting-Endpoints = 'csp-endpoint="/api/csp-report"'
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io mailto:; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; report-uri /api/csp-report; report-to csp-endpoint"

# Pretty /admin URL
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
