<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050811" />
  <title>Menelik Admasu — 3D Badge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 30% 40%, #0c2540 0%, #050811 65%, #02040a 100%);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      color: #fff;
    }
    .navbar {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 440px);
      height: 52px;
      background: rgba(20, 28, 45, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 0 20px;
      z-index: 20;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
    }
    .navbar .brand {
      font-weight: 700;
      font-size: 1.02rem;
      letter-spacing: 0.3px;
    }
    .navbar .actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .navbar a, .navbar button {
      appearance: none;
      border: 0;
      background: rgba(255,255,255,0.08);
      color: #e2e8f0;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      cursor: pointer;
      text-decoration: none;
      font-size: 15px;
    }
    .navbar a:hover, .navbar button:hover { background: rgba(255,255,255,0.16); }
    .hint {
      position: fixed;
      top: calc(max(16px, env(safe-area-inset-top)) + 62px);
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.78rem;
      white-space: nowrap;
      pointer-events: none;
      z-index: 20;
    }
    .hero-copy {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(28px, env(safe-area-inset-bottom));
      text-align: center;
      pointer-events: none;
      z-index: 15;
      padding: 0 16px;
    }
    .hero-copy h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      line-height: 1.15;
      font-weight: 800;
    }
    .hero-copy h1 span {
      background: linear-gradient(90deg, #38bdf8, #60a5fa 45%, #fff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero-copy p {
      margin-top: 8px;
      color: #93c5fd;
      font-size: 0.95rem;
      font-weight: 500;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      touch-action: none;
    }
    canvas:active { cursor: grabbing; }
    .loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #050811;
      z-index: 50;
      transition: opacity .4s ease;
    }
    .loading.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div class="loading" id="loading">Loading 3D badge…</div>

  <div class="navbar">
    <div class="brand">Menelik OS</div>
    <div class="actions">
      <a href="/" title="Home">⌂</a>
      <a href="https://github.com/Menelik2" target="_blank" rel="noopener" title="GitHub">⌥</a>
    </div>
  </div>
  <div class="hint">Drag to swing · Tap to flip</div>

  <div class="hero-copy">
    <h1><span>Welcome to</span><br/>My Portfolio</h1>
    <p>Full-Stack Developer · Bahir Dar</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const NAME = 'MENELIK ADMASU';
    const ROLE = 'Full-Stack Developer';
    const SCHOOL = 'Bahir Dar University';
    const TAG = 'Menelik OS';
    const PHOTO_URL = 'profile.jpg';
    const SITE_URL = location.origin || 'https://menelikcv.vercel.app';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.15, 11);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.55));
    const dirLight = new THREE.DirectionalLight(0xffffff, 2.4);
    dirLight.position.set(4, 6, 8);
    scene.add(dirLight);
    const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.45);
    rimLight.position.set(-5, -3, -4);
    scene.add(rimLight);

    const starGeo = new THREE.BufferGeometry();
    const starCount = 140;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 28;
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
      color: 0xffffff, size: 0.035, transparent: true, opacity: 0.45
    })));

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function loadImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    async function createFrontTexture(photo) {
      const c = document.createElement('canvas');
      c.width = 600; c.height = 900;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#e8e4dc';
      ctx.fillRect(0, 0, 600, 900);

      // subtle grid
      ctx.strokeStyle = 'rgba(15,23,42,0.06)';
      ctx.lineWidth = 1;
      for (let x = 0; x < 600; x += 24) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 900); ctx.stroke(); }
      for (let y = 0; y < 900; y += 24) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(600, y); ctx.stroke(); }

      // JUNIOR badge
      ctx.fillStyle = '#0f172a';
      roundRect(ctx, 40, 48, 120, 36, 6);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText('JUNIOR', 58, 72);

      // School chip
      ctx.fillStyle = '#1e3a5f';
      roundRect(ctx, 380, 42, 180, 48, 8);
      ctx.fill();
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('BAHIR DAR', 410, 62);
      ctx.font = '12px sans-serif';
      ctx.fillText('UNIVERSITY', 410, 78);

      // DEVELOPER title
      ctx.fillStyle = '#0f172a';
      ctx.font = '900 72px sans-serif';
      ctx.fillText('DEVELOPER', 36, 150);

      // Photo frame
      const fx = 90, fy = 180, fw = 320, fh = 420;
      const grad = ctx.createLinearGradient(fx, fy, fx + fw, fy + fh);
      grad.addColorStop(0, '#0b3a5c');
      grad.addColorStop(1, '#132238');
      ctx.fillStyle = grad;
      ctx.fillRect(fx, fy, fw, fh);

      if (photo) {
        const scale = Math.max(fw / photo.width, fh / photo.height);
        const pw = photo.width * scale;
        const ph = photo.height * scale;
        const px = fx + (fw - pw) / 2;
        const py = fy + (fh - ph) / 2;
        ctx.save();
        ctx.beginPath();
        ctx.rect(fx + 6, fy + 6, fw - 12, fh - 12);
        ctx.clip();
        ctx.drawImage(photo, px, py, pw, ph);
        ctx.restore();
      } else {
        ctx.fillStyle = '#94a3b8';
        ctx.beginPath(); ctx.arc(250, 320, 60, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#64748b';
        ctx.beginPath(); ctx.ellipse(250, 480, 110, 90, 0, Math.PI, 0); ctx.fill();
      }

      // Vertical side text
      ctx.save();
      ctx.translate(540, 680);
      ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = '#1e293b';
      ctx.font = '900 34px sans-serif';
      ctx.fillText('SOFTWARE ENGINEER', 0, 0);
      ctx.restore();

      // Name banner
      ctx.fillStyle = '#fff';
      ctx.fillRect(70, 620, 360, 50);
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(70, 620, 360, 50);
      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText(NAME, 88, 653);

      // Footer
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 760, 600, 140);
      ctx.fillStyle = '#fff';
      ctx.font = '900 44px sans-serif';
      ctx.fillText('PORTFOLIO', 40, 845);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '16px sans-serif';
      ctx.fillText("Don't repeat", 420, 825);
      ctx.fillText('yourself', 420, 848);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    async function createBackTexture() {
      const c = document.createElement('canvas');
      c.width = 600; c.height = 900;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#e8e4dc';
      ctx.fillRect(0, 0, 600, 900);

      ctx.fillStyle = '#0f172a';
      ctx.font = '900 38px sans-serif';
      ctx.fillText('SCAN HERE', 40, 90);

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(40, 130, 520, 620);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 30px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('CONNECT WITH ME', 300, 200);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '18px sans-serif';
      ctx.fillText('— GITHUB · PORTFOLIO —', 300, 232);

      // QR-like panel (pattern + site URL text)
      ctx.fillStyle = '#e8e4dc';
      ctx.fillRect(140, 270, 320, 320);
      ctx.fillStyle = '#0f172a';
      const cell = 16;
      for (let r = 0; r < 16; r++) {
        for (let col = 0; col < 16; col++) {
          const isCorner = (r < 4 && col < 4) || (r < 4 && col > 11) || (r > 11 && col < 4);
          if (isCorner || ((r * 7 + col * 13 + r * col) % 3 === 0)) {
            ctx.fillRect(160 + col * cell, 290 + r * cell, cell - 2, cell - 2);
          }
        }
      }

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText(NAME, 300, 660);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '18px sans-serif';
      ctx.fillText('— ' + ROLE + ' —', 300, 695);
      ctx.font = '14px sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(SITE_URL.replace(/^https?:\/\//, ''), 300, 730);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function createStrapTexture() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#111318';
      ctx.fillRect(0, 0, 128, 512);
      ctx.save();
      ctx.translate(64, 256);
      ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('MENELIK · DEV · ', 0, 10);
      ctx.restore();
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 3);
      return tex;
    }

    const photo = await loadImage(PHOTO_URL);
    const frontTex = await createFrontTexture(photo);
    const backTex = await createBackTexture();

    const badgeGroup = new THREE.Group();
    scene.add(badgeGroup);

    const holderMat = new THREE.MeshPhysicalMaterial({
      color: 0x111318, roughness: 0.35, metalness: 0.2, clearcoat: 0.55
    });
    const holderMesh = new THREE.Mesh(new RoundedBoxGeometry(2.35, 3.45, 0.06, 4, 0.14), holderMat);
    badgeGroup.add(holderMesh);

    const cardPlaneGeo = new THREE.PlaneGeometry(2.15, 3.22);
    const frontMesh = new THREE.Mesh(cardPlaneGeo, new THREE.MeshPhysicalMaterial({
      map: frontTex, roughness: 0.28, metalness: 0.04, clearcoat: 1, clearcoatRoughness: 0.12
    }));
    frontMesh.position.z = 0.032;
    badgeGroup.add(frontMesh);

    const backMesh = new THREE.Mesh(cardPlaneGeo, new THREE.MeshPhysicalMaterial({
      map: backTex, roughness: 0.28, metalness: 0.04, clearcoat: 1, clearcoatRoughness: 0.12
    }));
    backMesh.rotation.y = Math.PI;
    backMesh.position.z = -0.032;
    badgeGroup.add(backMesh);

    const metalMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.9, roughness: 0.22 });
    const ringMesh = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.035, 16, 32), metalMat);
    ringMesh.position.set(0, 1.78, 0);
    badgeGroup.add(ringMesh);
    const clampMesh = new THREE.Mesh(new RoundedBoxGeometry(0.42, 0.22, 0.1, 3, 0.04), metalMat);
    clampMesh.position.set(0, 2.02, 0);
    badgeGroup.add(clampMesh);

    const anchorPoint = new THREE.Vector3(0, 4.8, 0);
    const strapCurve = new THREE.CatmullRomCurve3([
      anchorPoint.clone(),
      new THREE.Vector3(0, 3.8, 0),
      new THREE.Vector3(0, 2.9, 0),
      new THREE.Vector3(0, 2.1, 0)
    ]);
    const strapMat = new THREE.MeshStandardMaterial({
      map: createStrapTexture(), roughness: 0.6, side: THREE.DoubleSide
    });
    let strapMesh = new THREE.Mesh(new THREE.TubeGeometry(strapCurve, 32, 0.12, 8, false), strapMat);
    scene.add(strapMesh);

    const restPos = new THREE.Vector3(0, -0.35, 0);
    const pos = new THREE.Vector3(0, 1.6, 0);
    const vel = new THREE.Vector3(0, 0, 0);
    let rotY = 0, rotYVel = 0, targetRotY = 0;
    let isDragging = false, pointerDownTime = 0;
    const dragOffset = new THREE.Vector3();
    const pointerDownPos = new THREE.Vector2();
    const pointer = new THREE.Vector2();
    const raycaster = new THREE.Raycaster();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const intersectPoint = new THREE.Vector3();

    function getPointerWorldPos(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      pointer.x = (clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      raycaster.ray.intersectPlane(dragPlane, intersectPoint);
      return intersectPoint;
    }

    window.addEventListener('pointerdown', (e) => {
      pointerDownTime = performance.now();
      pointerDownPos.set(e.clientX, e.clientY);
      const worldPt = getPointerWorldPos(e);
      if (raycaster.intersectObjects(badgeGroup.children).length > 0) {
        isDragging = true;
        dragOffset.copy(pos).sub(worldPt);
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const worldPt = getPointerWorldPos(e);
      const nextPos = worldPt.clone().add(dragOffset);
      const toCard = nextPos.clone().sub(anchorPoint);
      if (toCard.length() > 6.4) {
        toCard.normalize().multiplyScalar(6.4);
        nextPos.copy(anchorPoint).add(toCard);
      }
      vel.copy(nextPos).sub(pos).multiplyScalar(12);
      pos.copy(nextPos);
    });

    window.addEventListener('pointerup', (e) => {
      const elapsed = performance.now() - pointerDownTime;
      const moveDist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (isDragging && elapsed < 240 && moveDist < 12) {
        targetRotY += Math.PI;
        rotYVel += 4;
      }
      isDragging = false;
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (!isDragging) {
        const force = restPos.clone().sub(pos).multiplyScalar(28);
        vel.add(force.multiplyScalar(dt));
        vel.multiplyScalar(0.88);
        pos.add(vel.clone().multiplyScalar(dt));
      }

      badgeGroup.position.copy(pos);
      badgeGroup.rotation.z = THREE.MathUtils.lerp(badgeGroup.rotation.z, -pos.x * 0.22 - vel.x * 0.015, 0.15);
      badgeGroup.rotation.x = THREE.MathUtils.lerp(badgeGroup.rotation.x, (pos.y - restPos.y) * 0.08 + vel.y * 0.01, 0.15);

      const rotForce = (targetRotY - rotY) * 18;
      rotYVel = (rotYVel + rotForce * dt) * 0.85;
      rotY += rotYVel * dt + vel.x * 0.015;
      badgeGroup.rotation.y = rotY;

      const topOfClamp = new THREE.Vector3(0, 2.08, 0).applyEuler(badgeGroup.rotation).add(pos);
      const mid1 = anchorPoint.clone().lerp(topOfClamp, 0.33);
      const mid2 = anchorPoint.clone().lerp(topOfClamp, 0.66);
      mid1.x *= 0.45; mid2.x *= 0.8;
      strapCurve.points[0].copy(anchorPoint);
      strapCurve.points[1].copy(mid1);
      strapCurve.points[2].copy(mid2);
      strapCurve.points[3].copy(topOfClamp);
      strapMesh.geometry.dispose();
      strapMesh.geometry = new THREE.TubeGeometry(strapCurve, 28, 0.11, 8, false);
      strapMesh.scale.set(1, 1, 0.18);

      renderer.render(scene, camera);
    }
    animate();

    document.getElementById('loading').classList.add('hide');
    setTimeout(() => document.getElementById('loading')?.remove(), 500);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
