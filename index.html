<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#3a6ea5" />
  <title>Menelik Admasu — Portfolio</title>
  <script>
  (function () {
    var v = "20261015deskfix2";
    Promise.all([
      fetch("shell-a.txt?v=" + v, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("a " + r.status); return r.text(); }),
      fetch("shell-b.txt?v=" + v, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("b " + r.status); return r.text(); })
    ]).then(function (parts) {
      document.open();
      document.write(parts[0] + parts[1]);
      document.close();
    }).catch(function (err) {
      document.body.innerHTML = "<pre style=\"padding:24px;font:14px system-ui\">Load failed: " + String(err) + "</pre>";
    });
  })();
  </script>
</head>
<body>
  <p style="font:14px system-ui;padding:24px;color:#555">Loading Menelik OS…</p>
</body>
</html>
