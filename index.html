<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Menelik Admasu — Portfolio</title>
  <script>
  (function () {
    var GOOD = "https://raw.githubusercontent.com/Menelik2/MyCV/0b2fcde6dc32469dd2563cdf9f6bfbf58747f63b/index.html";
    var V = "20261015deskfix1";
    function injectPatch() {
      if (document.querySelector('script[src*="desk-view-patch"]')) return;
      var s = document.createElement("script");
      s.src = "desk-view-patch.js?v=" + V;
      document.body.appendChild(s);
    }
    function apply(html) {
      html = html.replace(/20260823phonefs1/g, V);
      // Ensure styles use new cache key
      html = html.replace(/styles\.css\?v=[^"]+/g, "styles.css?v=" + V);
      document.open();
      document.write(html);
      document.close();
      // Patch after scripts in written doc have a chance to parse
      setTimeout(injectPatch, 50);
      setTimeout(injectPatch, 400);
    }
    fetch(GOOD, { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(apply)
      .catch(function (err) {
        document.body.innerHTML =
          "<pre style='padding:24px;font:14px/1.4 system-ui'>Failed to load portfolio shell.\n" +
          String(err) +
          "\n\nOpen <a href='" + GOOD + "'>last good index</a> or hard-refresh.</pre>";
      });
  })();
  </script>
</head>
<body>
  <p style="font:14px system-ui;padding:24px;color:#555">Loading Menelik OS…</p>
</body>
</html>
