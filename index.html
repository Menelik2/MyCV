<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#3a6ea5" />
  <title>Menelik Admasu — Portfolio</title>
  <script>
  (function () {
    fetch("shell.html?v=20261015deskfix2", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (html) {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function (err) {
        document.body.innerHTML =
          "<pre style=\"padding:24px;font:14px system-ui\">Could not load shell.html\n" +
          String(err) +
          "</pre>";
      });
  })();
  </script>
</head>
<body>
  <p style="font:14px system-ui;padding:24px;color:#555">Loading Menelik OS…</p>
</body>
</html>
